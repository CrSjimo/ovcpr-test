name: Publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-publication
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      revision: ${{ steps.target.outputs.revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          path: target
          persist-credentials: false
      - name: Protected publication target selection
        id: target
        run: echo "revision=$(git -C target rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Site generation from Git blobs with locked tools
        env:
          TARGET_SHA: ${{ steps.target.outputs.revision }}
        run: |
          cd "$RUNNER_TEMP"
          python "$GITHUB_WORKSPACE/target/tools/ci.py" --stage pages --repository "$GITHUB_WORKSPACE/target" --candidate-sha "$TARGET_SHA" --output "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ${{ runner.temp }}/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
  smoke:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - name: Public metadata verification
        env:
          PAGE_URL: ${{ needs.deploy.outputs.url }}
          TARGET_SHA: ${{ needs.build.outputs.revision }}
        run: python tools/smoke.py --base-url "$PAGE_URL" --expected-revision "$TARGET_SHA"
